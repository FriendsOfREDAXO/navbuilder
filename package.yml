package: navbuilder
version: '2.0.0-dev'
author: 'Friends Of REDAXO'
supportpage: https://github.com/FriendsOfREDAXO/navbuilder
license: MIT

description:
    de: 'NavBuilder — Navigationen per Drag & Drop bauen und über überschreibbare Fragmente ausgeben.'
    en: 'NavBuilder — build navigations via drag & drop and render them through overridable fragments.'

page:
    title: translate:navbuilder_title
    perm: navbuilder[]
    pjax: false
    icon: rex-icon fa-bars
    subpages:
        menus: {title: translate:navbuilder_menus}

requires:
    packages:
        structure: '^2.9.0'
        mediapool: '^2.9.0'
    redaxo: '^5.18.0'
    php:
        version: '>=8.1'

installer_ignore:
    - .github
    - .gitignore
    - CLAUDE.md
    - composer.json
    - composer.lock
    - phpunit.xml.dist
    - tests
    - vendor
